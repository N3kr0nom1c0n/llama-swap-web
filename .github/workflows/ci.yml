name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  SMOKE_IMAGE: llama-swap-web:ci
  SMOKE_CONTAINER: llama-swap-web-ci

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest httpx

      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.SMOKE_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f compose.example.yml config

  container-smoke:
    runs-on: ubuntu-latest
    needs:
      - docker-build
      - compose-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build local smoke image
        run: docker build -t "${SMOKE_IMAGE}" .

      - name: Prepare smoke mounts
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d)"
          echo "SMOKE_DIR=${SMOKE_DIR}" >> "${GITHUB_ENV}"
          mkdir -p "${SMOKE_DIR}/models/chat/smoke" "${SMOKE_DIR}/backups" "${SMOKE_DIR}/data/tmp" artifacts/qa
          touch "${SMOKE_DIR}/config.yaml" "${SMOKE_DIR}/models/chat/smoke/smoke.gguf"
          chmod -R 777 "${SMOKE_DIR}"

      - name: Start smoke container
        run: |
          set -euo pipefail
          docker run --rm -d --name "${SMOKE_CONTAINER}" -p 127.0.0.1:8081:8081 \
            -e APP_HOST=0.0.0.0 \
            -e APP_PORT=8081 \
            -e MANAGER_MODEL_ROOT=/models \
            -e LLAMA_SWAP_MODEL_ROOT=/models \
            -e LLAMA_SWAP_CONFIG_PATH=/app/config.yaml \
            -e BACKUPS_DIR=/backups \
            -e DOWNLOAD_TEMP_DIR=/data/tmp \
            -v "${SMOKE_DIR}/models:/models" \
            -v "${SMOKE_DIR}/config.yaml:/app/config.yaml" \
            -v "${SMOKE_DIR}/backups:/backups" \
            -v "${SMOKE_DIR}/data:/data" \
            "${SMOKE_IMAGE}"

      - name: Container smoke endpoints
        env:
          BASE_URL: http://127.0.0.1:8081
          QA_ARTIFACT_DIR: artifacts/qa
        run: |
          set -euo pipefail
          SMOKE_BACKUPS_DIR="${SMOKE_DIR}/backups" bash scripts/container-smoke.sh

      - name: Playwright smoke
        env:
          BASE_URL: http://127.0.0.1:8081
          ALLOW_E2E_MUTATIONS: "1"
        run: npm run e2e -- --project=chromium

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-qa-artifacts
          path: artifacts/qa
          if-no-files-found: ignore

      - name: Stop smoke container
        if: always()
        run: |
          docker stop "${SMOKE_CONTAINER}" || true
          rm -rf "${SMOKE_DIR:-}"
