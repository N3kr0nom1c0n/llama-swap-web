services:
  llama-swap-manager:
    image: ghcr.io/n3kr0nom1c0n/llama-swap-web:latest
    container_name: llama-swap-manager
    restart: unless-stopped
    user: "10001:10001"
    env_file:
      - path: .env
        required: false
    ports:
      - "8081:8081"
    # Required if the optional Docker socket mount is enabled while the
    # manager runs as UID/GID 10001. Set DOCKER_SOCKET_GID in .env with:
    #   stat -c '%g' /var/run/docker.sock
    # group_add:
    #   - "${DOCKER_SOCKET_GID:?Set DOCKER_SOCKET_GID to the Docker socket group id}"
    volumes:
      - ./.env:/app/.env
      # SSH-first remote target rigs: mount the manager key read-only, then
      # configure Settings -> Target Rigs with /data/ssh/id_ed25519.
      - ./ssh:/data/ssh:ro
      - llama-swap-manager-data:/data
      # Local single-host mode only: mount these if the manager runs on the
      # same host/storage as llama-swap and uses the default local target rig.
      # - /path/to/llama.cpp/models:/models
      # - /path/to/llama-swap/config.yaml:/app/config.yaml
      # - /path/to/llama-swap/backups:/backups
      # Optional local restart: only mount this when LLAMA_SWAP_RESTART_ENABLED=true.
      # It lets the manager restart the configured llama-swap container.
      # - /var/run/docker.sock:/var/run/docker.sock

volumes:
  llama-swap-manager-data:
